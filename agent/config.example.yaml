# 复制为 config.yaml 再改；API key 与代理节点放 ~/.config/bioagent/（见 agent/README.md），不进仓库
assistant_name: BioAgent
model: claude-opus-5
cwd: ./workspace
readonly_dirs: []
daily_cost_cap_usd: 20
memory:
  enabled: true
  auto_summarize: true
  max_chars: 4000
proxy:
  enabled: true
  port: 17890
  controller_port: 19090
  stop_on_exit: true
  domains:
  - anthropic.com
  - claude.ai
  - google.com
  - googleapis.com
  - scholar.google.com
  - gstatic.com
  - github.com
  - githubusercontent.com
  - huggingface.co
  - hf.co
biomni:
  enabled: false   # Orgalyst 演示不需要 Biomni 工具库；装了 biomni/ 后可改为 true
  # 新对话默认加载的模块（按需加载，省每轮开销）；modules 是可用全集
  default_modules: [support_tools, database, literature]
  modules:
  - biomni.tool.support_tools
  - biomni.tool.database
  - biomni.tool.literature
  - biomni.tool.genomics
  - biomni.tool.genetics
  - biomni.tool.molecular_biology
  - biomni.tool.protocols
  - biomni.tool.pharmacology
  - biomni.tool.immunology
  - biomni.tool.cancer_biology
  - biomni.tool.cell_biology
  - biomni.tool.microbiology
  - biomni.tool.pathology
  - biomni.tool.physiology
  - biomni.tool.bioimaging
  - biomni.tool.biochemistry
  - biomni.tool.biophysics
  - biomni.tool.bioengineering
  - biomni.tool.synthetic_biology
  - biomni.tool.systems_biology
  - biomni.tool.glycoengineering
  - biomni.tool.lab_automation

# 单个对话的上下文上限（token）
context_limit_tokens: 1000000

# 额外的领域工具 MCP 服务器（Agent 侧按 name 前缀 mcp__<name>__ 看到工具）
mcp_servers:
  - name: orgalyst
    enabled: true
    command: python
    args: [../orgalyst/mcp_server.py]
    env:
      CELLPOSE_LOCAL_MODELS_PATH: ../weights/cellpose
