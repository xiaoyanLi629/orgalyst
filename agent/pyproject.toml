[project]
name = "bioagent"
version = "0.1.0"
description = "Terminal biomedical research agent (Claude Agent SDK + Biomni)"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk==0.2.152",
  "rich>=13.7",
  "prompt_toolkit>=3.0.47",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.1",
  "aiofiles>=23.2",
  "python-multipart>=0.0.9",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bioagent*"]

[tool.setuptools.package-data]
"bioagent.web" = ["static/*", "static/vendor/*"]
