[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orgalyst"
version = "0.2.0"
description = "Organoid bright-field image analysis toolkit: organ-specific Cellpose segmentation, YOLO counting, morphometry, QC, group comparison, growth curves, reproducible HTML reports, and an MCP server for agent use."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["cellpose==3.1.1.3", "ultralytics==8.4.152", "numpy<2.3", "scikit-image>=0.22", "scipy", "pandas", "pillow", "opencv-python-headless", "matplotlib", "tifffile", "pyyaml", "tqdm", "mcp>=1.0"]

[project.scripts]
orgalyst = "orgalyst.cli:main"

[tool.setuptools]
packages = ["orgalyst"]
